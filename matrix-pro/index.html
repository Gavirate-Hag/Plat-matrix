<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma Matrix — Matrix Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23D9480F%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-weight=%22bold%22%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F2EC;--ink:#1C1A16;--side:#16140F;--side-ink:#EDE7DB;--side-muted:#9C9584;--ember:#D9480F;--ember-2:#F76707;--fd:'Fraunces',Georgia,serif;--fb:'Manrope',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--side);color:var(--side-ink)}
  .topbar .in{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ember-2),var(--ember));display:grid;place-items:center;font:700 19px var(--fd);color:#fff}
  .marca{font:600 17px var(--fd)} .sub{font-size:11px;color:var(--side-muted);letter-spacing:.04em;text-transform:uppercase}
  .topbar a{margin-left:auto;color:var(--side-ink);font-size:13px;text-decoration:none;border:1px solid #3a362c;border-radius:9px;padding:6px 12px}
  .wrap{max-width:820px;margin:0 auto;padding:30px 20px 70px}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ember)}
  h1{font:600 32px/1.15 var(--fd);letter-spacing:-.02em;margin:4px 0 22px}
  .hero{background:var(--side);color:var(--side-ink);border-radius:12px;padding:24px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(247,103,7,.35),transparent 70%)}
  .hero p{margin:0;color:var(--side-muted);position:relative}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <div class="brand-mark">M</div>
  <div><div class="marca">Plataforma Matrix</div><div class="sub">IA para negócios</div></div>
  <a href="../">← Plataforma</a>
</div></div>
<div class="wrap">
  <div class="eyebrow">Plataforma Matrix</div>
  <h1>Matrix Pro</h1>
  <div class="hero"><p>Em construção.</p></div>
</div>
</body>
</html>
